name: Build and Release

on:
  push:
    tags:
      - '*'
jobs:
  Pack-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your tag is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Check skill (zero-drift)
        run: pnpm skill:check
      - name: Build page
        run: |
          pnpm run 'page:build'
      - name: Build Extension
        run: |
          pnpm run local:build
      - name: Pack Extension
        run: |
          pnpm run local:tar
          pnpm run local:zip
          pnpm run local:tar
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Stage daemon release assets
        run: pnpm run skill:pack
        env:
          EXCALI_SKILL_DIST_DIR: ${{ runner.temp }}/excali-skill-dist
          # Presence (the Rust tray) is built by the `Presence-Actions` matrix
          # job below — one native runner per target — and its assets are added
          # to the release in `Release-Actions`.
          EXCALI_SKIP_PRESENCE: '1'
      - name: Pack skill
        run: |
          # The skill tarball carries docs only: ADR 0012 keeps build products out
          # of git and out of the skill dir, so `--exclude` is a guard against a
          # binary being reintroduced unnoticed (the skill:check gate is the
          # primary tripwire).
          tar -czf skills-${{ github.ref_name }}.tar.gz \
            --exclude='bin/*' \
            -C skills/excali-local .
      - name: Upload daemon assets
        uses: actions/upload-artifact@v4
        with:
          name: excali-bridge-assets
          path: ${{ runner.temp }}/excali-skill-dist/*
      # upload-artifact keeps paths relative to the least common ancestor, so a
      # multi-path glob that mixes depths (packages/local/.output vs the repo
      # root) recreates dist/packages/local/... on download — and `gh release
      # create dist/*` then tries to upload the directory. Stage everything
      # flat instead.
      - name: Flatten extension + skill archives
        run: |
          mkdir -p release-flat
          cp ./packages/local/.output/*.zip release-flat/
          cp ./packages/local/*.tar.gz release-flat/
          cp ./skills-${{ github.ref_name }}.tar.gz release-flat/
          ls -la release-flat/
      - name: Upload extension + skill archives
        uses: actions/upload-artifact@v4
        with:
          name: excali-packages
          path: release-flat/*
      - run: echo "🍏 This job's status is ${{ job.status }}."

  # ADR 0014 build matrix: macOS (aarch64 + x86_64) and Linux (x86_64).
  # Windows is deliberately absent:
  # TODO(windows): add excali-presence-windows target — welcome PR (no maintainer Windows machine)
  Presence-Actions:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: excali-presence-macos-aarch64.app.zip
          - runner: macos-14
            target: x86_64-apple-darwin
            asset: excali-presence-macos-x86_64.app.zip
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: excali-presence-linux-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      # build-app.sh packs the Go daemon into the bundle as the tray's sidecar
      # (native host binary, no cross-compile), so it must exist before packing.
      - uses: actions/setup-go@v5
        if: runner.os == 'macOS'
        with:
          go-version: '1.22'
      - name: Build sidecar for the bundle
        if: runner.os == 'macOS'
        run: pnpm run bridge:build
      # Linux builds the bare tray binary; its tray-icon dependency links GTK,
      # which the runner does not ship.
      - name: Install GTK for the Linux tray
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev
      - name: Build presence asset
        run: pnpm run presence:pack --target ${{ matrix.target }} --strict
        env:
          EXCALI_SKILL_DIST_DIR: ${{ runner.temp }}/excali-presence-dist
      - name: Upload presence asset
        uses: actions/upload-artifact@v4
        with:
          name: excali-presence-${{ matrix.target }}
          path: ${{ runner.temp }}/excali-presence-dist/${{ matrix.asset }}

  Release-Actions:
    needs:
      - Pack-Actions
      - Presence-Actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download daemon assets
        uses: actions/download-artifact@v4
        with:
          name: excali-bridge-assets
          path: dist
      - name: Download extension + skill archives
        uses: actions/download-artifact@v4
        with:
          name: excali-packages
          path: dist
      - name: Download presence assets
        uses: actions/download-artifact@v4
        with:
          pattern: excali-presence-*
          path: dist
          merge-multiple: true
      - name: Re-checksum all assets
        run: |
          find dist -type f ! -name checksums.txt -print0 \
            | xargs -0 sha256sum \
            | awk '{n=$2; sub(/.*\//, "", n); print $1"  "n}' \
            | sort -k2 > dist/checksums.txt
          cat dist/checksums.txt
      - name: Release
        env:
           GH_TOKEN: ${{ github.token }}
        run: |
          # Release assets, side by side:
          #   excali-bridge-{darwin-arm64,darwin-amd64,linux-amd64,windows-amd64.exe}
          #   excali-presence-{macos-aarch64,macos-x86_64}.app.zip + excali-presence-linux-x86_64
          # TODO(windows): add excali-presence-windows target — welcome PR (no maintainer Windows machine)
          gh release create ${{ github.ref_name }} \
            --title "🎉 Excali Local ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            ./dist/*
      - run: echo "🍏 This job's status is ${{ job.status }}."
