name: Build and Release

on:
  push:
    tags:
      - '*'
jobs:
  Pack-Actions:
    runs-on: ubuntu-latest
    steps:
      - run: echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
      - run: echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
      - run: echo "🔎 The name of your tag is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      - run: echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "🖥️ The workflow is now ready to test your code on the runner."
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install
      - name: Check skill (zero-drift)
        run: pnpm skill:check
      - name: Build page
        run: |
          pnpm run 'page:build'
      - name: Build Extension
        run: |
          pnpm run local:build
      - name: Pack Extension
        run: |
          pnpm run local:tar
          pnpm run local:zip
          pnpm run local:tar
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Stage daemon release assets
        run: pnpm run skill:pack
        env:
          EXCALI_SKILL_DIST_DIR: ${{ runner.temp }}/excali-skill-dist
      - name: Pack skill
        run: |
          # The skill tarball carries docs only: ADR 0012 keeps build products out
          # of git and out of the skill dir, so `--exclude` is a guard against a
          # binary being reintroduced unnoticed (the skill:check gate is the
          # primary tripwire).
          tar -czf skills-${{ github.ref_name }}.tar.gz \
            --exclude='bin/*' \
            -C skills/excali-local .
      - name: Release
        env:
           GH_TOKEN: ${{ github.token }}
        run: |
          gh release create ${{ github.ref_name }} \
            --title "🎉 Excali Local ${{ github.ref_name }}" \
            --generate-notes \
            --draft \
            ./packages/local/.output/*.zip \
            ./packages/local/*.tar.gz \
            ./skills-${{ github.ref_name }}.tar.gz \
            "$RUNNER_TEMP"/excali-skill-dist/*
      - run: echo "🍏 This job's status is ${{ job.status }}."

